<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>oaki mockup stage</title>
<style>
  :root { --ground: #3B3226; }
  * { margin: 0; box-sizing: border-box; }
  body { min-height: 100vh; display: grid; place-items: center; background: var(--ground); font-family: Arial, sans-serif; }
  .stage { perspective: 1600px; }

  /* ── Book ─────────────────────────────── */
  .book { position: relative; width: 440px; aspect-ratio: 1100 / 1945; transform-style: preserve-3d; transform: rotateY(-26deg) rotateX(2deg); }
  .book .cover, .book .back { position: absolute; inset: 0; }
  .book .cover { background: center / cover no-repeat; transform: translateZ(14px); border-radius: 2px 4px 4px 2px; }
  .book .cover::after { content: ""; position: absolute; inset: 0; border-radius: inherit;
    background: linear-gradient(100deg, rgba(255,255,255,.14) 0%, rgba(255,255,255,0) 12%, rgba(0,0,0,0) 82%, rgba(0,0,0,.18) 100%),
                linear-gradient(90deg, rgba(0,0,0,.22) 0, rgba(0,0,0,0) 14px); }
  .book .spine { position: absolute; left: 0; top: 0; width: 28px; height: 100%; background: #1c1c1c;
    background-image: linear-gradient(180deg, rgba(255,255,255,.07), rgba(0,0,0,.25)); transform: translateX(-14px) rotateY(-90deg); }
  .book .pages { position: absolute; right: 0; top: 1px; bottom: 1px; width: 28px;
    background: repeating-linear-gradient(90deg, #efece6 0 2px, #ddd8cf 2px 3px); transform: translateX(14px) rotateY(90deg); }
  .book .back { background: #1c1c1c; transform: translateZ(-14px); }
  .book .shadow { position: absolute; left: -4%; right: -12%; bottom: -6px; height: 46px; background: radial-gradient(ellipse at 45% 50%, rgba(0,0,0,.45), rgba(0,0,0,0) 68%); transform: rotateX(90deg); transform-origin: bottom; filter: blur(7px); }

  /* ── iPad ─────────────────────────────── */
  .ipad { position: relative; width: 560px; aspect-ratio: 3 / 4; background: #101010; border-radius: 34px; padding: 22px;
    box-shadow: inset 0 0 0 2px #2c2c2c, inset 0 0 0 4px #0a0a0a, 0 40px 80px rgba(0,0,0,.5); transform: rotateY(-14deg) rotateX(2deg); }
  .ipad .screen { width: 100%; height: 100%; border-radius: 12px; background: #000 center / cover no-repeat; overflow: hidden; }
  .ipad .screen video, .ipad .screen img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .ipad .cam { position: absolute; top: 10px; left: 50%; width: 6px; height: 6px; border-radius: 50%; background: #1e1e1e; transform: translateX(-50%); }
</style>
</head>
<body>
<div class="stage" id="stage"></div>
<script>
  const q = new URLSearchParams(location.search);
  const img = q.get("img") || "/images/05.jpg";
  const bg = q.get("bg");
  const mode = q.get("mode") || "book";
  const video = q.get("video");
  if (bg) document.documentElement.style.setProperty("--ground", bg);
  const stage = document.getElementById("stage");
  if (mode === "ipad") {
    stage.innerHTML = `<div class="ipad"><div class="cam"></div><div class="screen">` +
      (video ? `<video src="${video}" muted autoplay loop playsinline></video>` : `<img src="${img}" alt="">`) +
      `</div></div>`;
  } else {
    stage.innerHTML = `<div class="book"><div class="back"></div><div class="spine"></div><div class="pages"></div><div class="cover" style="background-image:url('${img}')"></div><div class="shadow"></div></div>`;
  }
</script>
</body>
</html>
